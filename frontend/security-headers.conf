# Cabeçalhos de segurança da página (as respostas de /api já vêm com os do Helmet).
# Ficam num arquivo à parte porque o nginx NÃO herda add_header do bloco server para um
# location que tenha o próprio add_header: cada location precisa incluir este arquivo.
# connect-src libera as fontes do Google porque o service worker (PWA) as busca com fetch().
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
