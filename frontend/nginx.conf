# Serve o build do React e repassa /api para o back-end (mesma origem: cookies e sem CORS).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;
  server_tokens off;

  # Compacta JS/CSS/JSON (o pacote de gráficos cai de ~570 kB para ~160 kB).
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://backend:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Manifesto do PWA: o nginx não conhece a extensão .webmanifest (sairia como octet-stream).
  # Regra só para este arquivo: um bloco `types` no server substituiria a tabela inteira.
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Arquivos com hash no nome podem ficar em cache "para sempre".
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: qualquer outra rota cai no index.html (o React decide o que mostrar).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
